[project]
name = "study-platform"
version = "0.1.0"
description = "AI study platform backend infrastructure"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.54,<1",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1,<2",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "psycopg[binary,pool]>=3.2,<4",
    "alembic>=1.14,<2",
    "pgvector>=0.3,<1",
    "langgraph>=1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "httpx>=0.28,<1",
    "ruff>=0.9,<1",
]

[project.scripts]
study-api = "study_platform.cli.serve:main"
study-setup-checkpointer = "study_platform.cli.setup_checkpointer:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/study_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires explicitly configured local PostgreSQL databases"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
